name: DEPLOY PROD 

on: 
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Provisionar e Lançar (PROD)
    runs-on: ubuntu-latest

    environment: prod

    steps:
    - name: Baixar código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configurar dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restaurar pacotes (.NET Restore)
      run: dotnet restore ./src/backend/Estoque.sln

    - name: Limpar solução (.NET Clean)
      run: dotnet clean ./src/backend/Estoque.sln --configuration Release

    - name: Compilar solução (.NET Build)
      run: dotnet build ./src/backend/Estoque.sln --configuration Release --no-restore

    - name: Executar testes (.NET Test)
      run: dotnet test ./src/backend/Estoque.sln --configuration Release --no-build --verbosity normal

    - name: Publicar API (.NET Publish)
      run: dotnet publish ./src/backend/Estoque.API/Estoque.API.csproj --configuration Release --no-build --output ${{ github.workspace }}/app-publish

    - name: Login Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Instalar Terraform
      uses: hashicorp/setup-terraform@a1502cd9e758c50496cc9ac5308c4843bcd56d36 # v3.0.0

    - name: Terraform Init
      working-directory: ./infra
      run: terraform init -backend-config="key=prod.terraform.tfstate"

    - name: Terraform Plan
      working-directory: ./infra
      run: terraform plan -var-file="ambientes/prod.tfvars"

    - name: Terraform Apply (PROD)
      env: 
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      working-directory: ./infra
      run: terraform apply -var-file="ambientes/prod.tfvars" -auto-approve

    - name: Deploy para Azure App Service (PROD)
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'app-devops-training-prod-toledo'
        package: '${{ github.workspace }}/app-publish'